[project]
name = "web-search-mcp"
version = "0.1.0"
description = "Self-owned web search/fetch MCP — SearXNG first, cloud providers as fallback/diversity, quota-tracked"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.28",
    "python-dotenv>=1.1",
    "youtube-transcript-api>=1.2.4",
    "curl-cffi>=0.16.3",
    "trafilatura>=2.2.0",
    "pymupdf>=1.28.2",
    "camoufox[geoip]>=0.5.6",
    "yt-dlp[default]>=2026.8.19",
    "fastembed>=0.8.1",
    "rank-torrent-name>=1.11.1",
]

[tool.uv]
package = false
